<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/geomaster/globe.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoMaster - Aplikacja Geograficzna</title>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('geomaster-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/geomaster/assets/index-rPNm_kIj.js"></script>
    <link rel="stylesheet" crossorigin href="/geomaster/assets/index-GY3iA7ph.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] transition-colors">
    <div id="root"></div>
  </body>
</html>
